yamlname: Project Automation Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  run-automation:
    # Explicitly specify official GitHub-hosted environments to avoid the rogue runner
    runs-on: 
      - ubuntu-latest
      - github-hosted

    steps:
    - name: Free Disk Space (Ubuntu Runner)
      if: runner.os == 'Linux'
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"

    - name: Checkout Repository Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Verify Environment
      run: |
        echo "The agent successfully bypassed the rogue runner!"
        df -h
