name: Project Automation Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
    # 1. Clear out pre-installed bloating software safely
    - name: Free Disk Space (Ubuntu Runner)
      if: runner.os == 'Linux'
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"

    # 2. Shallow checkout to bypass the "no space left on device" log issue
    - name: Checkout Repository Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    # 3. Verify the environment safely
    - name: Verify Environment
      run: |
        echo "The environment is safe, clean, and working!"
        df -h
